services:
  ai-service:
    build:
      context: ../ai-service
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
        TORCH_PACKAGES: torch==2.3.1 torchvision==0.18.1
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
